name = "arlib"
defaultTargets = ["Arlib"]

# `lake test` builds the smoke-test library, whose modules are short worked
# examples of the public API — see `ArlibTest/`. They are deliberately NOT part
# of `defaultTargets`: a consumer of the library should not pay to compile them.
testDriver = "ArlibTest"

# arlib — a curated, Mathlib-style library of reusable Lean 4 results in
# randomised algorithms, knowledge compilation, and the probability and
# information theory underneath them.
#
# The Mathlib `rev` below is a **lock, not a commitment**: nothing in the library
# is written against a particular Lean release, and the pin exists only so that a
# build is reproducible and Lake does not re-resolve (and warn) on every
# invocation. It moves forward whenever someone runs the upgrade:
#
#     lake update mathlib                                      # or: pick a tag
#     cp .lake/packages/mathlib/lean-toolchain lean-toolchain  # follow Mathlib
#     lake exe cache get && lake build
#
# `lean-toolchain` must always be whatever Mathlib's own `lean-toolchain` says —
# elan needs a concrete toolchain, and a mismatch fails deep inside Mathlib.
#
# `doc-gen4` is deliberately NOT required here. Adding it would make every
# `lake build` — including offline ones that reuse an already-materialised
# Mathlib — try to fetch another package over the network. CI appends the
# requirement itself for the documentation job only; see
# `.github/workflows/build.yml` and CONTRIBUTING.md.
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Arlib"

[[lean_lib]]
name = "ArlibTest"
